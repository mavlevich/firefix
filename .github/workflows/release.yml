name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version extensions/firefix/manifest.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Unlisted signing on addons.mozilla.org. The add-on is not listed
      # in the store, AMO only signs it so Firefox can install it for good.
      - name: Sign
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
